# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # Project title
  author:       "Sam"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Reprogrammable protocol-emulator CPU: 4 deterministic hardware threads, line-code SERDES, CRC unit, logic-analyser capture; UART/SPI/I2C/USB-LS/10BASE-T, device emulation and bus monitors in firmware"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     12000000  # 12 MHz (USB low speed = 8 cycles/bit); run at 20 MHz for 10BASE-T

  # How many tiles your design occupies? (IHP tile ~202 x 155 um)
  tiles: "6x4"          # competition allocation: 24 tiles

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_msf"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "tt_um_msf_alu.v"
    #- "tt_um_msf_bootrom_data.v"
    - "tt_um_msf_bootrom.v"
    - "tt_um_msf_ctrl.v"
    - "tt_um_msf_pio.v"
    - "tt_um_msf_regfile.v"
    - "tt_um_msf_sram.v"
    - "tt_um_msf_serdes.v"
    - "tt_um_msf_crc.v"
    - "tt_um_msf_cap.v"
    - "tt_um_msf_filt.v"
    #- "RM_IHPSG13_2P_512x16_c2_bm_bist.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs (all firmware-readable via IN_RD / WAIT_EDGE ..., ui)
  ui[0]: "BOOT_DIRECT (1 = run SRAM firmware at reset)"
  ui[1]: "BOOT_PARALLEL (loader byte source: 0 UART, 1 parallel) / debug page"
  ui[2]: "IN2 / parallel boot data bit 2 / debug view (high at reset), debug select"
  ui[3]: "IN3 / parallel boot data bit 3 / debug select"
  ui[4]: "IN4 / parallel boot data bit 4 / debug select"
  ui[5]: "IN5 / parallel boot data bit 5 / debug select"
  ui[6]: "IN6 / parallel boot data bit 6 / debug select"
  ui[7]: "IN7 / parallel boot data bit 7 / debug select"

  # Outputs (UO register: OUT_W / UO_SET / UO_CLR / UO_TGL / UO_WI)
  uo[0]: "STATUS0 (boot: waiting for frame)"
  uo[1]: "STATUS1 (boot: last frame OK)"
  uo[2]: "STATUS2 (boot: last frame CRC error)"
  uo[3]: "STATUS3 (boot: starting firmware)"
  uo[4]: "OUT4"
  uo[5]: "OUT5"
  uo[6]: "OUT6"
  uo[7]: "STATUS7 (boot: parallel byte ack)"

  # Bidirectional pins: generic emulator GPIO, firmware-defined. Defaults used
  # by the boot ROM and firmware/*.s:
  uio[0]: "GPIO0 / UART TX (boot ACK, monitor reports) / USB D-"
  uio[1]: "GPIO1 / UART RX (boot) / parallel strobe / USB D+"
  uio[2]: "GPIO2 / SPI SCK / ETH TD+"
  uio[3]: "GPIO3 / SPI MOSI / ETH TD-"
  uio[4]: "GPIO4 / SPI MISO"
  uio[5]: "GPIO5 / SPI CS / I2C SDA"
  uio[6]: "GPIO6 / I2C SCL"
  uio[7]: "GPIO7 / SR shift pin (default) / SPI monitor MISO"

# Do not change!
yaml_version: 6
