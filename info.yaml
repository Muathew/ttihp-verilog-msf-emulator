# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # Project title
  author:       "Sam"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A tiny programmable protocol emulator CPU: bit-bangs UART/SPI/I2C (and more) in firmware over 8 bidirectional pins"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     12000000  # Clock frequency in Hz (12 MHz target)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2  (12 tiles ~ 24K cells)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_msf"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "tt_um_msf_alu.v"
    #- "tt_um_msf_bootrom_data.v"
    - "tt_um_msf_bootrom.v"
    - "tt_um_msf_ctrl.v"
    - "tt_um_msf_pio.v"
    - "tt_um_msf_regfile.v"
    - "tt_um_msf_sram.v"
    #- "RM_IHPSG13_2P_512x16_c2_bm_bist.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: ""
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "UART_TX"
  uio[1]: "UART_RX"
  uio[2]: "SPI_SCK"
  uio[3]: "SPI_MOSI"
  uio[4]: "SPI_MISO"
  uio[5]: "I2C_SDA"
  uio[6]: "I2C_SCL"
  uio[7]: "GPIO"

# Do not change!
yaml_version: 6
