name: formal

on:
  push:
  workflow_dispatch:

jobs:
  formal:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Yosys (YoWASP)
        run: pip install yowasp-yosys

      # BMC of properties F1-F7 (all inputs free), cover reachability, and the
      # mutation check (re-introduced review bugs B1-B3 must be caught).
      - name: Formal (yosys sat)
        run: python formal/run_formal.py --yosys yowasp-yosys --depth 16
