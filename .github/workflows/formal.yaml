name: formal

on:
  push:
  workflow_dispatch:
    inputs:
      prove:
        description: "also prove the controller's properties for all time (ABC pdr)"
        type: boolean
        default: false
      block:
        description: "instead, prove one property block for all time by k-induction (e.g. F17)"
        type: string
        default: ""
      block_depth:
        description: "the block proof's induction depth"
        type: string
        default: "4"

jobs:
  formal:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      # Native Yosys, SymbiYosys and ABC. Since the four threads the top-level
      # BMC is too big for YoWASP (32-bit WASM) Yosys, which ran out of memory.
      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-01'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # BMC of the properties (all inputs free) with ABC bmc3, cover
      # reachability, and the mutation check (re-introduced bugs B1-B4 must
      # each give a counterexample; a tool error never counts as caught).
      - name: Formal (SymbiYosys + ABC)
        if: ${{ !inputs.block }}
        run: python3 formal/run_formal.py --engine abc --depth 16

      # Started by hand: PDR on each of the controller's properties, an hour at most.
      - name: Unbounded proofs
        if: ${{ inputs.prove && !inputs.block }}
        run: python3 formal/run_formal.py --engine abc --depth 16 --prove --prove-timeout 3600 --top ctrl --no-mutants

      # Started by hand: one block's assertions, alone, by k-induction (smtbmc), an hour at most.
      - name: Block proof
        if: ${{ inputs.block }}
        run: python3 formal/run_formal.py --block "${{ inputs.block }}" --depth "${{ inputs.block_depth }}" --prove-timeout 3600

      # A failed induction step's trace shows the state the invariants still allow.
      - name: Block proof traces
        if: ${{ failure() && inputs.block }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: block-traces
          path: formal/work/block_*/
          retention-days: 7
