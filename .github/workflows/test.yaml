name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # fpga/rtl must stay a copy of src (except the board's SRAM and boot ROM)
      - name: FPGA RTL matches src
        run: python3 tools/check_fpga_sync.py

      # Static deadline check: no WAIT_CMP in the firmware is ever late (and the
      # analysis agrees with the ISA model); a UART at 9 cycles a bit must fail.
      - name: Firmware deadlines
        run: |
          python3 tools/msf_timing.py --all --check-model 20000
          ! python3 tools/msf_timing.py firmware/uart_tx.s -D BIT=9 -D STOP=9

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
