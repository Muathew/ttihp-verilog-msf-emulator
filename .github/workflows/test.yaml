name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # fpga/rtl must stay a copy of src (except the board's SRAM and boot ROM)
      - name: FPGA RTL matches src
        run: python3 tools/check_fpga_sync.py

      # Static deadline check: no WAIT_CMP in the firmware is ever late; a UART at 9
      # cycles a bit must fail, and so must an @range promise the program breaks
      # (planted-bug run, 8 Nov). The check against the RTL comes after the tests.
      - name: Firmware deadlines
        run: |
          python3 tools/msf_timing.py --all --check-model 20000
          ! python3 tools/msf_timing.py firmware/uart_tx.s -D BIT=9 -D STOP=9
          ! python3 tools/msf_timing.py firmware/margin_i2c.s -D THIGH=15

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog sigrok-cli

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          # the template's own check (it also catches errors, not only failures)
          python -m cocotb_tools.check_results results.xml

      # Every deadline reached on the RTL, with the tests' peers, and none below
      # what the checker promised (DeadlineWatch in test/fw_tb.py wrote the log).
      - name: Deadlines against the RTL
        run: python3 tools/msf_timing.py --all --rtl-log test/deadlines_seen.json

      # A sample of planted timing bugs: a certified one must not run late.
      - name: Planted timing bugs
        run: python3 tools/fw_mutants.py --sample 1 --jobs 2

      # The waveforms read by decoders written by other people.
      - name: sigrok decoders
        run: python3 tools/sigrok_check.py

      # Protocols nobody designed, drawn at random: decoded exactly or refused.
      - name: Learning a protocol
        run: pip install pytest && python3 -m pytest test/test_learn_tool.py test/test_site.py test/test_msfc.py -q

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      # The results always (small); the waveform only when something failed: it is 90 to
      # 170 MB a run, and on 11 Nov the account's artifact store was full, which failed
      # this job after every test had passed. A full store must not fail the tests, and
      # a week is long enough to fetch a waveform.
      - name: upload test results
        if: success() || failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          retention-days: 7
          path: |
            test/results.xml
            test/output/*

      - name: upload waveform of a failed run
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-waveform
          retention-days: 7
          path: test/tb.fst
