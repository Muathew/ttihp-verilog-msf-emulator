name: gds

# On demand only (docs/plan.md decision 7): the run takes about 2.5 h of
# Actions minutes, so start it from the Actions tab or with
# `gh workflow run gds.yaml --ref <branch>`.
on:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  # Sign-off and netlist = RTL on this layout (gds_checks.yaml, which can
  # also check an earlier run's layout without building it again).
  checks:
    needs: gds
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/gds_checks.yaml
    with:
      run_id: ${{ github.run_id }}

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp27a
